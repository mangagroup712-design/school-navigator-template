<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- svgファイルを事前に読み込んでおくことでシームレスに表示 -->
  <link rel="preload" href="env/map/floor1.svg" as="image" />
  <link rel="preload" href="env/map/floor2.svg" as="image" />
  <link rel="preload" href="env/map/floor3.svg" as="image" />

  <link rel="apple-touch-icon" href="/icon180.png" sizes="180x180" />

  <!-- Google Fonts: Material Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <title>SchoolNav</title>
</head>

<body>
  <div id="map-page" class="page">
    <section class="navigation-banner" aria-live="polite">
      <div class="banner-route">
        <span class="material-symbols-outlined">my_location</span>
        <div><small>現在地</small><strong id="current-location">昇降口（1階）</strong></div>
        <button type="button" class="banner-search route-search-button" data-open-search="current" aria-label="現在地を検索">
          <span class="material-symbols-outlined">search</span>
        </button>
        <span class="material-symbols-outlined banner-arrow">arrow_forward</span>
        <div><small>目的地</small><strong id="destination-location">目的地を選択</strong></div>
        <button type="button" class="banner-search route-search-button" data-open-search="destination" aria-label="目的地を検索">
          <span class="material-symbols-outlined">search</span>
        </button>
      </div>
      <div id="route-error" class="route-error" role="alert" aria-live="assertive"></div>
      <ol id="route-steps" class="route-steps" aria-label="移動の手順" hidden></ol>
      <div id="room-search-panel" class="room-search-panel" role="dialog" aria-modal="false" aria-labelledby="room-search-title" hidden>
        <div class="room-search-dialog">
          <div class="room-search-dialog-header">
            <div><small>校内ナビゲーション</small><h2 id="room-search-title">どこへ向かいますか？</h2></div>
            <button id="room-search-close" type="button" class="dialog-close" aria-label="検索を閉じる"><span class="material-symbols-outlined">close</span></button>
          </div>
          <div class="search-mode" role="group" aria-label="設定対象">
          <button type="button" class="search-mode-button active" data-search-mode="destination">
            <span class="material-symbols-outlined">flag</span><span><b>目的地</b><small>行きたい教室</small></span>
          </button>
          <button type="button" class="search-mode-button" data-search-mode="current">
            <span class="material-symbols-outlined">my_location</span><span><b>現在地</b><small>出発する場所</small></span>
          </button>
          </div>
        <div id="current-search-field" class="search-field" hidden>
          <label for="current-room-search-input">現在地を検索</label>
          <div class="room-search-form">
            <input id="current-room-search-input" type="search" placeholder="例：昇降口、1-1" autocomplete="off">
            <button id="current-room-search-submit" type="button" class="fab" aria-label="現在地を検索"><span class="material-symbols-outlined">search</span></button>
          </div>
        </div>
        <div id="destination-search-field" class="search-field">
          <label for="room-search-input">目的地を検索</label>
          <div class="room-search-form">
            <input id="room-search-input" type="search" placeholder="例：1-1、音楽室" autocomplete="off">
            <button id="room-search-submit" type="button" class="fab" aria-label="目的地を検索"><span class="material-symbols-outlined">search</span></button>
          </div>
        </div>
          <div id="room-search-results" class="room-search-results" role="listbox"></div>
        </div>
      </div>
    </section>
    <div id="map"></div>
  </div>
  <script type="module" src="src/main.ts"></script>
</body>

</html>
